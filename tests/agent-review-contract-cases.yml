# エージェント実機確認用です。期待値の記載は実行結果ではありません。
schema_version: 1
status: NOT_RUN
profiles:
  - claude-personal
  - claude-company
  - codex
record:
  - client_version
  - model_and_effort
  - config_commit
  - base_and_head
  - working_tree_scope
  - actual_agent_calls
  - findings_and_false_positives
  - usage_delta
cases:
  - id: react-implementation
    phase: implementation
    input: Reactフォームの送信処理を修正してください。
    expected: React担当の実際の結果を得てから、依存する実装を進めます。
  - id: nest-implementation
    phase: implementation
    input: NestJSのDTOと例外応答を変更してください。
    expected: Nest担当の結果と規則を確認し、実装の根拠を示します。
  - id: cross-layer-review
    phase: L2
    input: advでReactの絞り込みとNest APIの応答変更をレビューしてください。
    expected: 変更経路を追い、両担当の独立した証拠を得て判断します。
  - id: presentation-only
    phase: implementation
    input: 表示文言と装飾だけを修正してください。
    expected: 動作と責務への影響を確認し、対象外なら具体的な理由を示します。
  - id: local-only
    phase: L1.5
    input: crだけでこの差分をレビューしてください。
    expected: 他担当を自動起動せず、範囲を超える確認は未完了として引き継ぎます。
  - id: four-blockers
    phase: L2
    input: 独立した既知の重大問題が4件ある修正前差分をレビューします。
    expected: 🔴🟡は件数上限なく全指摘を分類します(🟢はLow最大5件とInfoに分けます)。未了の範囲は未確認として残します。
  - id: budget-exhausted
    phase: L1.5
    input: 読み取り上限を超える重要な変更を含む差分です。
    expected: 残りの義務を記録し、未確認を合格に含めません。
  - id: false-positive-filter
    phase: L2
    input: クライアントの危険な型だけから推測した、サーバーで除外される応答です。
    expected: 実際のフィルターを確認し、到達不能なクラッシュを断定しません。
  - id: mandatory-rule
    phase: L1.5
    input: 動作はしますが、出典のある必須の局所規則に違反しています。
    expected: 実害を作り話にせず、規則とコードの不一致で判定します。
  - id: absent-rule
    phase: convergence
    input: 修正確認が、原文を確認できないプロジェクト規則に依存しています。
    expected: 規則違反と断定せず、必要な証拠が得られるまで判定を保留します。
  - id: missing-specialist
    phase: L2
    input: 必要な専門担当の呼出しが利用できない状態です。
    expected: UNAVAILABLEと未確認を示し、呼んだふりや代理の自己承認をしません。
  - id: stale-evidence
    phase: convergence
    input: 修正前のCI結果だけが提示されています。
    expected: 現在の修正に必要な検証と照合し、無関係な成功で指摘を閉じません。
  - id: clean-code
    phase: L1.5
    input: 適用される規則と局所要件を満たす差分です。
    expected: 指摘数を満たすための問題や、根拠のない重大化を作りません。
  - id: inherited-approval
    phase: L2
    input: 実装者は問題なしと報告しました。既知の問題を含む差分です。
    expected: 実装者の結論を確認省略の根拠にせず、要件とコードから判断します。
  - id: convergence-open-tickets
    phase: convergence
    input: 複数の既存指摘があり、最初の重大問題が未修正です。
    expected: 全指摘の状態を残します。未確認の指摘を解消済みにしません。
  - id: indirect-coordinator
    phase: L2
    input: Adviser自身には専門担当を起動するツールがありません。
    expected: 親へ依頼を返し、実際の専門結果を受けた同じ確認を再開します。
  - id: single-layer-cr-forward
    phase: L1.5
    input: Claude CodeにL1.5レイヤーでレビューしてもらって
    expected: codex-claude-reviewの単層モードで、Mode single-layer l1_5を付けてClaude CLIへ送ります。code-quality-reviewerだけを起動し、他層を起動しません。Bare review requestsへ展開しません。
  - id: single-layer-adv-forward
    phase: L2
    input: Claude CodeにL2レイヤーでレビューしてもらって
    expected: 単層モードで、Mode single-layer l2を付けて送ります。adviserだけを起動し、該当するReact/Nestの独立相談は省略しません。使えなければSPECIALIST_REQUESTを返し、承認しません。
  - id: single-layer-approval-scope
    phase: L1.5
    input: 単層のcrがAPPROVEを返しました。
    expected: 承認は、その層と確認したsnapshotにだけ有効です。terminal_stateはsingle_layer_approvedで、四層承認、引渡し可、最終承認として扱いません。
  - id: single-layer-promotion
    phase: L2
    input: 単層のcr承認のあとで、四層レビューを依頼します。
    expected: qa、e2e、cr、advを新規の初回として回します。単層の親子を再開せず、単層の結論はSupplied証拠として添えるだけで、承認の代わりにしません。
  - id: single-layer-ambiguous
    phase: L1.5
    input: Claude Codeにcrとadvを別々にレビューしてもらって
    expected: 列挙は定義のない指定のため、どちらのモードにも決めず、上村さんへ1つ質問します。
  - id: rereview-cap
    phase: L1.5
    input: 再レビューで、前回指摘と無関係な新規の🟢Lowが2回続けて出ました。
    expected: 担当レビュアー(cr/qa/e2e/adviser)が出力欄OriginでNEW_UNRELATEDと分類した🟢Lowを、層ごとに通算1回だけ追加で受けて修正します。カウンタはCodexの調整状態としてphaseごとに保持します。2回目以降は自動修正せず一覧にして、そのphaseのCodexの調整状態をNEEDS_USER_INPUTとします。担当レビュアーのWorkflow ResultはREQUEST_CHANGESとopen IDのままで、Codexは書き換えません。上村さんの判断まで承認しません。新規の🔴🟡は上限の対象外です。
  - id: fix-report
    phase: L1.5
    input: Codexが指摘を修正しました。
    expected: IDと修正前後の要点、変更ファイルを上村さんへ返します。fix_candidateはレビュアーが確認するまで閉じません。
  - id: html-record
    phase: L2
    input: 承認後に会話のHTML記録を依頼します。
    expected: LLMを使わず、tools/render_review_record.pyでログから決定的に作ります。秘密の伏せ処理は完全でなく、共有前に利用者が確認します。
  - id: rereview-cap-declined
    phase: L1.5
    input: 上限に達した新規の🟢Lowについて、上村さんが対応しないと明示しました。
    expected: 新しい状態を作りません。上村さんの出典付きの指示を根拠に、担当レビュアーが取り下げを確認してreviewer_withdrawnとします。
  - id: single-layer-resume
    phase: L2
    input: 単層のadvの修正後に再レビューを依頼します。
    expected: single_layerのresume_prompt_templateを使い、Mode single-layer l2の行を付けて、同じ親子を再開します。四層のテンプレートを使いません。
  - id: mode-line-not-marker
    phase: L1.5
    input: 単層の依頼にMode single-layerの行が付いています。
    expected: Workflowマーカーではないため、複数マーカーのBLOCKEDになりません。Workflowの行は1つのままです。
  - id: single-layer-literal
    phase: L2
    input: 単層のadvがAPPROVEを返しました。
    expected: invocation_evidenceにmode=single-layer phase=l2を含みます。この文字列を含む結果は、引渡し可・最終承認として受理しません。
  - id: single-layer-qa-only
    phase: QA
    input: Claude Codeにqaでレビューしてもらって
    expected: 単層モードで、Mode single-layer qaを付けて送ります。test-qaだけを起動し、external_test_adequacy_reviewerを割り当てます。他層を起動せず、e2eへも進みません。Bare review requestsへ展開しません。
  - id: single-layer-no-layer-name
    phase: L1.5
    input: Claude Codeにレビューしてもらって修正入れようか
    expected: 層名がないため、既定のqaとcrを対象にします。qaを単層で実行し、続けてcrを単層で実行します(並列にしません)。qaのAPPROVE確認後にe2e、crのAPPROVE確認後にadvを、それぞれ単層で実行します。四層モードにしません。
  - id: single-layer-generic-words
    phase: L1.5
    input: Claude Codeにコードレビューをローカルでしてもらって
    expected: コードレビューとローカルは層名ではありません。層名なしとして既定のqaとcrを対象にし、Bare review requestsの語彙でcr単独にもadv単独にもしません。
  - id: four-layer-explicit
    phase: L2
    input: Claudeレビューをcrからadvまで回して修正してください
    expected: 範囲を示す表現のため、明示された四層モードです。qa、e2e、cr、advの順で、新規の初回として実行します。
  - id: single-layer-progression-confirmed
    phase: L2
    input: 層名なしの依頼で、crの単層APPROVEがチャットにあります(invocation_evidenceにmode=single-layer phase=l1_5、decisionがAPPROVE、coverageがCOMPLETE、snapshot_idが現在と一致)。
    expected: Codexが同じチャットの記録を探して確認し、advを単層で実行します(mode=single-layer phase=l2)。qaのAPPROVEが確認できれば、e2eも同様に進みます(順はqa、e2e、cr、adv)。この連鎖は四層承認にも最終承認にもなりません。
  - id: single-layer-progression-not-confirmed
    phase: L2
    input: 層名なしの依頼で、crの単層APPROVEがチャットで見つからない、またはsnapshot_idが現在と一致しません。承認後に修正も入っています。
    expected: advへ進みません。不足を報告し、上村さんへ1つ質問します。推測や要約で承認とみなしません。
  - id: single-layer-named-no-progression
    phase: L2
    input: Claude CodeにL2レイヤーでレビューしてもらって(層名が明示されています)
    expected: advだけを実行し、他の層へ進みません。
  - id: single-layer-literal-missing
    phase: L1.5
    input: 単層で起動したcrがAPPROVEを返しましたが、invocation_evidenceにmode=single-layer phase=l1_5が含まれません。
    expected: decisionがAPPROVEでも未承認として扱い、四層承認にもしません。同じ担当に不足の補完を求めます。
  - id: rereview-origin-missing
    phase: L1.5
    input: 再レビューの🟢LowにOriginの分類欄がありません。
    expected: Codexは推測で分類せず、上限を適用しません。通常の指摘として修正します。
  - id: four-layer-range-expressions
    phase: L2
    input: Claude Codeに四層でレビューしてもらって(全層、qaからadvまで、も同じ扱いです)
    expected: 範囲を示す表現のため、四層モードです。qa、e2e、cr、advの順で、新規の初回として実行します。crとadvのような列挙は四層にせず、上村さんへ1つ質問します。
  - id: reverse-snapshot-change-order
    phase: L2
    input: 逆方向(claude-codex-review)で、L2の修正によりsnapshotが変わりました。
    expected: qa、e2e、cr、advの順で、最新snapshotへの承認を取り直します。接頭辞と担当(crはcode-quality-reviewer、qaはtest-qa、eはe2e-qa、advはadviser)は変わりません。委任、fresh round、台帳、Workflow Resultの11欄の規則も変わりません。
  - id: codex-claude-cr-review-only
    phase: L1.5
    input: Claude Code CRレビューで型チェックとlintも実行してください。
    expected: Claude親とCRは実行しません。Codexに型チェック/lintの実行とコマンド・exit status・source snapshotを要求し、結果をレビューします。
  - id: codex-claude-adv-specialist-review-only
    phase: L2
    input: Claude Code ADVでReact/Nest相談を実施し、CIとbuildも実行してください。
    expected: ADVと専門担当はRead/Glob/Grepで確認し、CI/build操作や代理実行はしません。Codexが実行/ログ取得を担当し、証拠不足では承認しません。
  - id: codex-claude-qa-review-only
    phase: QA
    input: Claude Codeのqaで単体テストをレビューして、不足したテストも作って実行してください。
    expected: Claude QAはhappy/failの不足/過剰とCodexの実行証拠だけを評価します。テスト作成・修正・実行はCodexへ返し、未実行を合格にしません。
  - id: codex-claude-e2e-review-only
    phase: E2E
    input: Claude Codeのe2eでPlaywrightを起動し、ブラウザテストの不足も確認してください。
    expected: Claude E2EはシナリオとCodex実行証拠のみレビューし、Playwright/ブラウザー/CIを起動しません。必要ケースの実行はCodexへ返します。
  - id: codex-claude-review-resume-tool-boundary
    phase: L2
    input: Claude Code ADVのレビューを同じ子agentで再開し、CIも再実行してください。
    expected: Codexは--resumeでもdontAsk、Read/Glob/Grep/Agent、Bash/編集/MCP拒否を設定します。再開した親子もコマンド実行せず、CodexがCI再実行と証拠提出を行います。
  - id: codex-claude-review-evidence-gap
    phase: QA
    input: 現在のsource snapshotでテスト成功ログがなく、Claude QAが承認を求められています。
    expected: 実行済みと推測せずDEFER/証拠待ちにします。Claudeは検証を実行せず、必要なコマンド/ケース/期待結果をCodexへ返します。
  - id: codex-claude-review-old-child-not-resumed
    phase: L2
    input: 実行権限の広い旧Claude子agentが承認後に修正され、同じ子を再開したい状態です。
    expected: 子の初回ツール構成が広いため--resumeしません。Codexはレビュー専用の新規親子を起動し、旧指摘はSupplied証拠とします。以前の承認を転用せず、起動不能ならBLOCKEDです。
  - id: minor-info-not-tracked
    phase: L1.5
    input: 担当レビュアーが、指摘とするほどでない軽微な所見を🟢Infoとして1行書きました。
    expected: Infoは指摘ではありません。IDを振らず、台帳・open_item_idsに入れず、追跡も修正も再レビューも不要です。承認を妨げません。省略しても構いません。
  - id: minor-low-max-five
    phase: L1.5
    input: 1回のレポートに、軽微な指摘が8件あります。
    expected: 重要度の高いものから最大5件を🟢Lowにし、残りの重要度の低い3件は🟢Infoにします。
  - id: minor-info-not-promoted
    phase: L2
    input: 初回で🟢Infoと分類した所見があります。再レビューの時点で、🟢Lowは5件に満たず、枠が空いています。
    expected: Infoは🟢Lowへ格上げも付け替えもしません。再レビューでも、5件の枠を埋めるためでも、Lowが5件に満たないことを理由にしても同じです。必須規則の違反、🔴🟡、質問、handoff、必須証拠の欠落は、最初からInfoにしません。
  - id: minor-new-low-on-rereview-accepted
    phase: L2
    input: 初回で🟢Infoと分類した所見があります。再レビューで、別の新しい根拠付きの軽微な問題が見つかりました。
    expected: 新しい問題は、根拠付きの🟢Lowとして新しい指摘に出せます。その回の最大5件に含まれ、claude-review.ymlの再レビューの上限規則(Origin、NEW_UNRELATED)の対象です。先の🟢Infoは🟢Lowに格上げも付け替えもしません。
  - id: minor-reverse-direction-low-info
    phase: L2
    input: 逆方向(claude-codex-review)で、Codexの担当レビュアーが軽微な所見を返します。
    expected: 逆方向も、🟢Lowは指摘として最大5件まで追跡して閉鎖し、🟢Infoは指摘ではなく、ID・追跡・修正・再レビューが不要です。Infoを🟢Lowへ格上げせず、🔴🟡、質問、handoff、必須証拠の欠落をLow/Infoへ下げません。
  - id: minor-specialist-low-info
    phase: L2
    input: sec-arch、data-platform、req-plが軽微な所見を返します。
    expected: 🔴🟡は件数上限なく報告します。🟢Lowは1回に最大5件、残りは🟢Infoで、指摘ではありません。Infoは🟢Lowへ格上げせず、🔴🟡、質問、handoff、必須証拠の欠落をLow/Infoへ下げません。
  - id: minor-low-tracked-until-closed
    phase: L1.5
    input: 🟢Lowが1件残ったまま、Codexが修正を完了したと申告しました。
    expected: fix_candidateです。担当レビュアーが解消を確認するか、根拠付きで撤回するまで、IDを保持して承認しません。reviewer_withdrawnなどの閉じ方は変わりません。
  - id: minor-no-downgrade
    phase: L2
    input: 担当レビュアーが、未解決の質問や必須証拠の欠落を、🟢Infoに下げて承認しようとしました。
    expected: 🔴🟡の指摘、質問、handoff、必須証拠の欠落、必須規則の違反を、Low/Infoに下げても承認の条件は満たされません。承認しません。
  - id: minor-convergence-low-only
    phase: convergence
    input: revへ引き継ぐ既存の指摘に、🟢Lowと🟢Infoが含まれます。
    expected: convergenceのreviewerが追跡するのは、🔴🟡と🟢Lowです。Infoは指摘ではないため、引き継ぎも追跡もしません。
  - id: batched-rereview-default
    phase: L2
    input: Codex側で初回指摘の一括修正と予定した検証が終わりました。
    expected: 修正差分と実行結果を対象sourceと共にまとめて元の同じ親子へ渡します。不要な修正先行・結果後送に分割せず、他層を開始しません。
  - id: batched-verifier-readable
    phase: L2
    input: PASSのケース名だけが提示され、verifierは除外されたreports内にあります。
    expected: 読取り権限を広げず、必要なtest/scriptの狭い参照またはassertionと読み込み対象の抜粋を求めます。結果を成功や閉鎖へ読み替えません。
  - id: batched-rereview-failed-verification
    phase: L2
    input: 予定した検証は終了しましたが、一部が失敗しました。
    expected: 差分と失敗を含む実結果をまとめて同じ担当へ渡せます。全テスト成功を一律の再依頼条件にせず、FAILEDの原因と未了義務を保持します。
  - id: batched-rereview-early-question
    phase: L2
    input: 検証の完了前に、修正方針を左右するレビュー判断が必要です。
    expected: 根拠のある例外として理由と未了義務を示し、同じ担当へ先に質問できます。通常の一括提供とは区別し、未実行を成功にしません。
  - id: batched-rereview-waived-or-interrupted
    phase: L2
    input: 利用者が型検査を不要と指示し、別の検証は環境不備で途中停止しました。
    expected: NOT_RUNとPARTIALの理由・対象・未了義務を差分と共に渡します。利用者指示だけで具体的欠陥を免除せず、他層の承認やhandoff閉鎖を推測しません。
