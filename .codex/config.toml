################################################################################
# repo-root/.codex/config.toml
#
# Project-scoped configuration for Codex.
# Strategy:
# - Keep defaults stable across IDE / CLI.
# - Push L2+ review quality up in Chat/Codex before Browser Copilot.
# - Use profiles for execution modes (CLI only), not for every persona.
# - Use subagents for specialist review lenses.
################################################################################

# Stable default for day-to-day IDE + CLI usage.
# GPT-5.6 is the default model for this agent set.
model = "gpt-5.6-terra"
review_model = "gpt-5.6-sol"
personality = "pragmatic"
approval_policy = "on-request"
model_reasoning_effort = "medium"
developer_instructions = """
Act as the coordinator and delegate role-owned work to the registered agent.

Before delegation, state:
ROUTE: <agent>
REASON: <why selected>
SCOPE: <delegated scope>

Routing:
- requirement clarification -> pl
- implementation -> hq
- L0/L1 verification -> qa
- browser E2E design or implementation -> e2e_qa
- L1.5 code-quality review -> code_quality_reviewer
- review planning -> review_planner
- first-pass L2+ production-risk review -> adviser
- post-fix convergence review -> reviewer
- persistence risk -> data_platform
- security or trust-boundary risk -> sec_arch
- framework-specific risk -> react_ui_flow, vue_frontend, nestjs_backend, or spring_boot

Do not combine first-pass L2+ review with convergence review.
Do not silently inline work owned by a registered specialist.
If delegation is unavailable, state that before performing a scoped fallback.
"""

# Keep project root discovery predictable.
project_root_markers = [".git"]

# Default subagent orchestration limits.
[agents]
max_threads = 6
max_depth = 2
job_max_runtime_seconds = 900

[agents.pl]
description = "Clarifies requirements, scope, acceptance, constraints, and failure behavior without implementing."
config_file = "agents/pl.toml"

[agents.hq]
description = "Implements coding-ready tasks with minimal safe diffs and targeted validation."
config_file = "agents/hq.toml"

[agents.qa]
description = "Performs L0/L1 regression, contract, test, and verification analysis."
config_file = "agents/qa.toml"

[agents.e2e_qa]
description = "Designs and implements browser-level smoke and regression coverage for changed user flows."
config_file = "agents/e2e-qa.toml"

[agents.code_quality_reviewer]
description = "Performs L1.5 changed-line code-quality and human-review-readiness checks."
config_file = "agents/code-quality-reviewer.toml"

[agents.review_planner]
description = "Plans review scope, required reading, risk routes, and convergence checks without editing."
config_file = "agents/review-planner.toml"

[agents.adviser]
description = "Performs first-pass L2+ production-risk review and routes specialist verification."
config_file = "agents/adviser.toml"

[agents.reviewer]
description = "Performs post-fix convergence review against prior Review Tickets and fix evidence."
config_file = "agents/reviewer.toml"

[agents.data_platform]
description = "Reviews persistence, transactions, retries, idempotency, migrations, and rollback risk."
config_file = "agents/data-platform.toml"

[agents.sec_arch]
description = "Reviews security, trust boundaries, authorization, secrets, PII, and dangerous contract drift."
config_file = "agents/sec-arch.toml"

[agents.react_ui_flow]
description = "Reviews React state ownership, effects, async UI behavior, forms, and server-client handoff."
config_file = "agents/react-ui-flow.toml"

[agents.vue_frontend]
description = "Reviews Vue reactivity, component contracts, async UI behavior, and hydration risk."
config_file = "agents/vue-frontend.toml"

[agents.nestjs_backend]
description = "Reviews NestJS guards, validation, DTOs, exception flow, and controller-service boundaries."
config_file = "agents/nestjs-backend.toml"

[agents.spring_boot]
description = "Reviews Spring transactions, validation, security configuration, and service-repository boundaries."
config_file = "agents/spring-boot.toml"

################################################################################
# Profiles (CLI only)
# NOTE: Profiles are experimental and NOT supported in the Codex IDE extension.
################################################################################

# Default implementation mode.
[profiles.hq_coder]
model = "gpt-5.6-terra"
personality = "pragmatic"
model_reasoning_effort = "medium"
approval_policy = "on-request"

# Requirement / scoping / acceptance clarification.
[profiles.req_pl]
model = "gpt-5.6-terra"
personality = "pragmatic"
model_reasoning_effort = "medium"
approval_policy = "on-request"

# Regression / contract / failure-path verification.
[profiles.test_qa]
model = "gpt-5.6-terra"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"

# Deep L2+ review mode.
# Use this when you want architecture / boundary / persistence / rollout risks,
# and want to lighten the load on Browser Copilot.
[profiles.l2plus_review]
model = "gpt-5.6-sol"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"

# Fast read-heavy exploration before editing or before spawning specialists.
[profiles.pr_explorer]
model = "gpt-5.6-luna"
personality = "pragmatic"
model_reasoning_effort = "medium"
approval_policy = "on-request"

[profiles.diff_convergence]
model = "gpt-5.6-sol"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"

# L1.5 design-aware code quality review.
# Use before L2+ review or human PR review.
[profiles.code_quality_reviewer]
model = "gpt-5.6-sol"
personality = "pragmatic"
model_reasoning_effort = "high"
approval_policy = "on-request"
