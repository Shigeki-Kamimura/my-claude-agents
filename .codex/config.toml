################################################################################
# repo-root/.codex/config.toml
#
# Project-scoped configuration for Codex.
# Strategy:
# - Keep the primary coordinator on GPT-6 Luna.
# - Use GPT-6 Astra for requirement planning and rare highest-risk escalation.
# - Use GPT-6.1 Sol for implementation and high-value review.
# - Keep routing, E2E, and framework specialists on GPT-6 Luna.
# - Keep CLI profiles in CODEX_HOME as separate *.config.toml files.
################################################################################

model = "gpt-6-luna"
personality = "pragmatic"
approval_policy = "on-request"
model_reasoning_effort = "medium"

project_root_markers = [".git"]

[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "xhigh"
