################################################################################
# repo-root/.codex/config.toml
#
# Project-scoped configuration for Codex.
# Strategy:
# - Keep the primary session on GPT-5.6 Terra for coordination.
# - Reserve GPT-5.6 Sol for implementation and explicit high-risk review.
# - Use GPT-5.6 Luna for bounded review routing.
# - Keep CLI profiles in CODEX_HOME as separate *.config.toml files.
################################################################################

model = "gpt-5.6-terra"
personality = "pragmatic"
approval_policy = "on-request"
model_reasoning_effort = "medium"

project_root_markers = [".git"]

[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
