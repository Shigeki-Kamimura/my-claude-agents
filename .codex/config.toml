################################################################################
# repo-root/.codex/config.toml
#
# Project-scoped configuration for Codex.
# Strategy:
# - Keep the primary coordinator on GPT-6.1 Sol / high.
# - Use GPT-6.1 Sol for requirement planning, implementation, and high-value review.
# - Keep routing, E2E, and narrow framework specialists on GPT-6 Luna.
# - Keep CLI profiles in CODEX_HOME as separate *.config.toml files.
################################################################################

model = "gpt-6.1-sol"
personality = "pragmatic"
approval_policy = "on-request"
model_reasoning_effort = "high"

# プロジェクト内の .codex/AGENTS.md は標準の親ディレクトリ探索に含まれません。
developer_instructions = """
Before implementation or review, locate the active repository root and read its
.codex/AGENTS.md plus .claude/knowledge/engineering-governance.md.
These are local engineering/routing instructions, not replacements for applicable
project AGENTS.md, platform rules, or security controls. Report material conflicts.
Apply the mandatory React/Nest consultation gate without waiting for an agent name
in the user's prompt. Pass the applicable policy clauses and source paths explicitly
to each custom agent; do not assume it inherits this developer instruction.
If either configured file is missing, report the setup gap rather than claiming
that routing or the adopted review principles were applied.
"""

project_root_markers = [".git"]

# Backlog MCP: credentials must come from the local Codex process environment.
# Set BACKLOG_DOMAIN and BACKLOG_API_KEY outside this repository before launching
# Codex. Do not put their values in this file or in a committed MCP config.
[mcp_servers.backlog]
command = "npx"
args = ["-y", "backlog-mcp-server"]
env_vars = ["BACKLOG_DOMAIN", "BACKLOG_API_KEY"]
default_tools_approval_mode = "prompt"

[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "xhigh"
