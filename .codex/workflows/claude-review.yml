# CodexとClaudeの自律レビューを調整する指示契約です。実行エンジンではありません。
schema_version: 1
workflow_id: codex-claude-review
runtime_validation: NOT_RUN
goal: 短い依頼からClaudeが自分で差分をレビューし、Codexが全指摘を一括修正して同じ担当へ再確認を依頼します。
activation:
  examples:
  - Claude Codeにレビューしてもらって修正入れようか
  - Claudeレビューをcrからadvまで回して修正してください
  - Claude CodeにL1.5レイヤーでレビューしてもらって
  - Claude CodeにL2レイヤーでレビューしてもらって
  - Claude Codeにqaでレビューしてもらって
  marker: 'Workflow: codex-claude-review'
  rule: Claude/Claude Codeを名指しした依頼で起動し、基本は単層モードです(single_layer参照)。層名が依頼に書かれていれば、その層だけを実行します。層名は次の語に限ります。cr(l1_5)はcr、L1.5、code-quality-reviewer。qaはqa、test-qa。e2eはe2e、E2E、e2e-qa。adv(l2)はadv、L2、L2+、adviser。Latin文字の語は前後がLatin文字・数字でないときだけ一致します(FAQやL2TPは不一致、日本語文中のQAは一致)。「コードレビュー」「ローカル」「品質」のような一般語は層名ではなく、.codex/AGENTS.mdのBare review requestsの語彙も使いません。層名がない依頼は、qaとcrを対象にします(single_layerのdefault_layers)。四層モードは、依頼が範囲を示す表現で明示した場合だけです。範囲を示す表現(〜から〜まで、四層、全層)は四層モード、列挙(crとadvなど)は定義がないため、上村さんへ1つ質問します。Claudeを名指ししないcr単独の依頼には適用しません。逆方向(Codexにレビューしてもらう依頼)に単層モードはありません。
  locate:
  - 対象プロジェクトの.codex/workflows/claude-review.ymlを読みます。
  - なければ.codex/AGENTS.mdのリンク先を解決し、その隣のworkflows/claude-review.ymlを読みます。
  - どちらにもなければ設定不足を報告します。別の設定を推測しません。
  exception: 四層モードが明示された依頼では、qa、e2e、cr、advの順の連続実行と、各担当自身による再レビューを許可します。単層モードでは、single_layer.progressionの条件を満たす進行(qa→e2e、cr→adv)と、各担当自身による同phaseの再レビューだけを許可し、それ以外の層は自動起動しません。
single_layer:
  start: 単層モードは、activation.ruleの条件を満たす依頼で起動し、該当phaseの担当だけを起動します。他層は、progressionの条件を満たす進行以外では起動しません。
  phase_values: '{phase}の取り得る値は、l1_5(cr)、qa、e2e、l2(adv)です。ownership.reviewersのキーと同じです。'
  default_layers: 層名がない依頼は、qaを、続けてl1_5(cr)を、それぞれ単層で順に実行します(並列にしません)。qaのAPPROVEを確認したらe2eを、crのAPPROVEを確認したらadvを、それぞれ直後に実行します。実行順はqa、e2e、cr、advで、四層の順と同じです。各層は自分の親子とWorkflow Resultを持ちます。
  progression:
    pairs: qaのAPPROVEを確認したらe2eへ、crのAPPROVEを確認したらadv(l2)へ進みます。対象は層名なしの既定の進行だけです。層名を明示した依頼は、その層だけを実行し先へ進みません。
    confirmation: Codexは同じチャットの記録から、直前の層のWorkflow Resultを探して確認します。次をすべて満たす記録だけを承認とします。invocation_evidenceにmode=single-layer phase=<直前のphase>を含む。native_verdictがL1.5_APPROVE(handoffだけのL1.5_APPROVE_WITH_NOTESを含む)またはAPPROVEで、decisionがAPPROVE。coverageがCOMPLETE。snapshot_idが現在のworking sourceと一致し、承認後にsource・テスト・要件・規則の変更がない。
    not_confirmed: 記録が見つからない、読めない、条件を満たさない、承認後に変更があった場合は、次の層へ進まず、不足を報告して上村さんへ1つ質問します。推測や要約で承認とみなしません。
    next_layer: 進んだ先も単層モードで、mode=single-layer phase=<次のphase>を使います。進行の連鎖は、承認がいくつそろっても四層承認、引渡し可、最終承認になりません。
  prompt_template: |
    {prefix}: {review_request}
    Workflow: codex-claude-review
    Mode: single-layer {phase}
    Workflow Resultのinvocation_evidenceに、文字列 mode=single-layer phase={phase} を必ず含めてください。
    利用者のbase・除外・今回固有の制約があれば: {user_constraints}
  resume_prompt_template: |
    {prefix}: 再レビューしてください。
    Workflow: codex-claude-review
    Mode: single-layer {phase}
    Workflow Resultのinvocation_evidenceに、文字列 mode=single-layer phase={phase} を必ず含めてください。
    前回読んだgovernanceのhash(任意、12桁以上): {governance_hash}
    新しい利用者回答・今回固有の制約があれば: {new_answers_or_constraints}
  rereview: 同じ親子を再開して同phaseだけを再確認します。
  scope_priority: 単層のときは、qa_contract.assignmentの両agent必須とreview_gates.orderより優先し、該当phaseのみ実行します。単層のqa/e2eでも、その実agentへexternal_test_adequacy_reviewer、phase、実際の利用者依頼を割り当てます。単層のcr/advがqa/e2e/l2へ割り当てたhandoffは単層では閉じず、未了の義務として報告します。
  approval: 単層の承認は、その層と確認した現snapshotにだけ有効です。四層承認、引渡し可、最終承認を意味しません。
  promotion: 利用者が四層を明示して昇格する場合は、qa、e2e、cr、advを新規の初回として回します。単層の親子は再開しません。承認済みの単層の結論はSupplied証拠として添えるだけで、承認の代わりにしません。
  consultation: 単層のadvでも、該当するReact/Nestの独立相談は省略できません。
  result: Workflow Resultの11項目は維持します。単層であることは、invocation_evidenceに固定文字列 mode=single-layer phase=<phase> を含めて示します。decisionがAPPROVEでも四層の承認ではありません。
  terminal_state: single_layer_approved
  terminal_state_note: 四層承認は未了です。
authority:
  required_sources:
  - .claude/knowledge/engineering-governance.md
  - .claude/knowledge/human-review-patterns.md
  - 対象プロジェクトの指示、要件、適用される規則です。
  rules:
  - 西口さんの原則、適用するproject規則、独立レビューを維持します。
  - このClaudeレビュー方向だけを更新し、逆方向のread-only Codex契約を変更しません。
  - 単独cr/qa/e/advは他レイヤを自動起動しません。
ownership:
  coordinator: Codexです。Claudeの初回レビューが完了するまで横やりの調査依頼や実装修正を挟みません。
  implementation: CodexのHQが🟢を含む全指摘をまとめて修正します。
  reviewers:
    l1_5: code-quality-reviewer
    qa: test-qa
    e2e: e2e-qa
    l2: adviser
  review_only: Claudeの親とcr・qa・e2e・adv、相談先の全agentは、ソース/要件/既存結果の読取り、証拠評価、指摘、質問、不足証拠の要求だけを行います。Claude自身と相談先は型チェック・lint・format・build・unit/integration/E2E/Playwright・CI/CDの実行/再実行/操作、アプリやサーバーの起動、依存導入、migration、スクリプト実行、source/test/fixture編集、stage/commit/push/mergeを行いません。
  codex_execution_owner: Codexのみがコードとテストの作成/修正、必要な検証コマンドの選定と実行、CIの再実行・ログ取得、環境準備、差分とsnapshot証拠の取得、HTMLログ生成を担当します。Claudeが検証不足を見つけたら実行せず、必要なコマンド/ケース/期待結果/根拠をCodexに返します。Codexは実際の実行コマンド・終了コード・対象source snapshot・CI run識別子を返し、Claudeがレビューします。
claude_cli:
  cwd: 必ずレビュー対象projectを保ちます。
  argv:
  - claude
  - --print
  - --output-format
  - json
  - --model
  - sonnet
  - --effort
  - medium
  - --permission-mode
  - dontAsk
  - --tools
  - Read,Glob,Grep,Agent,SendMessage
  - --allowedTools
  - Read
  - Glob
  - Grep
  - Agent
  - SendMessage
  - --disallowedTools
  - Bash
  - Edit
  - Write
  - NotebookEdit
  - mcp__*
  model_policy: 親の調整はSonnet/medium、各実agentは自身のmodel/effortです。adviserはclaude-opus-5-5/high、他の既定担当はSonnetです。Agent呼出のmodel/effort上書きで役割設定を変えず、明示された利用者指定を優先します。必要なL2モデルが利用不能なら承認を保留します。
  permission_basis: 利用者の最新指示に従いレビュー専用です。--toolsで読取りとAgent委譲/SendMessage再開だけを残し、--disallowedToolsでBash/編集/MCPを明示的に拒否します。dontAskで未許可の操作を拒否します。既存settingsのallowや子agentが制限を緩めたと扱いません。
  limits: OS/Codex/managed設定と実際の利用者制約は守ります。上位制限を迂回せず、止まる場合は確認不能として報告します。
  tools: 初回と--resumeの全回で同じ--tools/--allowedTools/--disallowedTools/--permission-modeを指定します。Claude親・子・専門担当はRead/Glob/Grepで資料を読み、Agent/SendMessageでレビュー相談と同じ子agentの再開だけを行います。Git差分、型チェック、CI等のコマンドはCodex側で実行してから証拠を渡します。起動側でこの制限を適用できない場合はBLOCKEDとし、権限を広げません。
  prompt_template: |
    {prefix}: {review_request}
    Workflow: codex-claude-review
    利用者のbase・除外・今回固有の制約があれば: {user_constraints}
  resume_prompt_template: |
    {prefix}: 再レビューしてください。
    Workflow: codex-claude-review
    前回読んだgovernanceのhash(任意、12桁以上): {governance_hash}
    新しい利用者回答・今回固有の制約があれば: {new_answers_or_constraints}
  invocation:
  - 各phaseの初回は独立した実担当を起動し、親session_idと実child agent_idを保持します。
  - 同phaseは親を--resumeし、親からSendMessageで元の実childを再開します。同名の新規起動を再開にしません。
  - 親/子の再開や元の比較対象を利用できなければ、状態を保持し確認不能として報告します。
  - 上記model_policyを適用し、再開時も同じ親/子と役割modelを維持します。実際の委譲結果を使い、CLI成功だけを承認にしません。
  - qa/e2eの実担当へexternal_test_adequacy_reviewer、phase、実際の利用者依頼を割り当てます。短い親依頼から設定を読み、親が実委譲時に伝えます。
  - 初回/--resumeのいずれもレビュー専用CLI制限とCodex実行責務を保持し、子agentと専門担当にも明示します。Claudeのコマンド実行・編集・CI操作を実際に検出した場合は承認不可として記録し、Codexが対処します。
review_entry:
  autonomy: Codexが確定したbase/HEAD、staged・unstaged・untrackedとrenameを含むGit差分・必要な元版の証拠を取得します。Claudeはその証拠をSuppliedとして扱い、Read/Glob/Grepで現ソース、要件、テスト、関連境界を独立に確認します。実装者の結論を根拠にチェックを省かず、不足があればCodexへ特定の証拠を要求します。
  scope: 明示base/除外を優先します。狭い指定がなければstaged・unstaged・untrackedを含め、index/worktreeの打消しや新規/削除/renameを落としません。
  base: Codexが実PRやproject規則から実baseを取得して出典とともに渡します。Claudeはproject規則と照合し、main等を推測しません。不明なbranch範囲は承認しません。
  identity: 担当がbase/HEADと確認した差分・untrackedの内容など、実際のworking sourceを識別できる情報を保持します。HEADだけで未コミット変更を同一と扱いません。
  comparison_basis: 利用者が許可したstaged-baseline方式ではCodex/HQが安全に固定した初回indexを使います。Codexは実baseに対する初回index差分と修正後のunstaged/untrackedを別々に取得し、元版・snapshot情報を渡します。ClaudeはRead等で現版を独立確認し、差分と過去の指摘を比較します。元内容や基準が失われたら確認不能です。
  no_packaging_gate: コマンド権限を持たないClaudeへCodexが必要なGit差分とsnapshotを一度渡すことは必須です。一方、レビューごとの巨大なmanifestや全文packet、未変更資料の再送や毎回のhash照合は行いません。必要な根拠だけ追加取得します。
  fallback: Git/規則/元内容/認証/環境が取得不能なら正確な不足を返します。必要な部分だけ補い、同じ担当で続けます。任意の包装がないだけでは停止しません。
  git_inspection: Codexは--no-ext-diff/--no-textconv等でGit差分を安全に取得し、snapshotと出典を提示します。Claude親子はBash/gitコマンドを実行せず、Read/Glob/Grepで元の実コードを閲覧します。
execution:
  cr_adv: CR/ADVはRead/Glob/Grepでレビューします。型チェック、lint、build、テスト、CI/CD、アプリ/サーバー起動、スクリプト実行は一切行いません。Claudeの親や専門相談先にも代理実行させません。Codexの実行記録と元コードを評価します。
  qa_e2e: QA/E2EもRead/Glob/Grepでテストケースと既存実行証拠の過不足をレビューするだけです。happy/fail両面を評価しますが、テスト/Playwright/型チェック/CIの実行や再実行、テスト生成・修正は一切しません。検証が必要ならCodexに正確な要求を返し、Codex実行結果をSuppliedとして対象snapshotと照合します。
review_cycle:
  initial: 全対象と必須相談を初回で確認し、🔴から🟢まで全指摘と未確認を出します。途中終了は同じ担当で続けます。
  fix: 初回レビュー完了後にCodexが全指摘を一括修正し、必要なテストを行います。ファイル/テスト編集ごとに再レビューを起動しません。
  rereview_inputs: 同じ担当が直接取得できない新しいtest command/case/結果と対象source、正確な利用者回答と出典、変更制約だけを一度添えます。既読の不変資料や全logは再送せず、governanceのRule loading across continuationsに従います。前回読んだgovernanceのhash(12桁以上)は任意で添えます。
  rereview: 短く再依頼し、元の子が前回確認したsource/指摘と現在の実差分・影響範囲を比較します。無関係な全面再探索を繰り返しません。
  rereview_cap: 再レビューは前回指摘の解消確認と、修正が導入した問題を中心にします。担当レビュアー(cr/qa/e2e/adviser。convergence専用のagentであるreviewerではありません)は、再レビューの各指摘に出力欄Origin(PRIOR_FINDING、FIX_INDUCED、NEW_UNRELATED)を付けます。分類は担当レビュアーだけが行い、Codexは推測も変更もしません。Originの定義は、cr(code-quality-reviewer)、qa(test-qa)、e2e(e2e-qa)、adviserの各agent定義にあります。Originがない指摘には上限を適用せず、通常どおり修正します。Origin NEW_UNRELATEDの🟢は、層(phase)ごとに、四層昇格や新しい初回、単層の進行をまたいで通算1回だけ追加で受けて修正します。通算1回のカウンタは、Codexの調整状態として、phase(l1_5、qa、e2e、l2)ごとに1つずつ、Codexの親sessionが持つ指摘台帳のphase別項目に保持します。担当レビュアーのWorkflow Resultには持たせません。それ以降のNEW_UNRELATEDの🟢は自動修正せず一覧にして、そのphaseのCodexの調整状態をNEEDS_USER_INPUTとします。担当レビュアーのWorkflow ResultはREQUEST_CHANGESとopen IDのままで、Codexは書き換えません。上村さんの判断まで閉じず、承認しません。新規の🔴🟡は上限の対象外です。先送りではなく、上限到達時の判断依頼です。上村さんが対応しないと明示した場合は、新しい状態を作らず、その出典付きの指示を根拠に、担当レビュアーが取り下げを確認してreviewer_withdrawnとします。
  closure: 修正者の申告だけで閉じません。元担当の解消確認か根拠付き撤回まで、🟢を含め全IDを保持します。
  unknown: 比較する元内容、仕様、必須証拠が未確認なら確認不能/非承認です。推測で解消・実行成功にしません。
consultation:
  required: L2の該当React/Nest境界は初回に必要な独立相談を行います。実装時の相談を流用せず、単層のadvでも省略しません。
  batch: adviserが境界を追い、責務別に質問をまとめます。実際に使える通常toolで相談し、使えなければ親へ必要な質問だけ返し同じ担当へ戻します。
  scope: 専門担当は担当境界に限定し、出典・版・元担当のある未変更事実は活用します。未解決や変更箇所以外の重複調査を避けます。
  record: 実相談ID/回答原本、重要な未解決、adviserの採否と根拠は保持します。指摘数や専門家名だけで完了にしません。
qa_contract:
  assignment: qaとe2eはexternal_test_adequacy_reviewerとして割り当て、両方の実agentを必ず呼びます。
  scope:
    qa: unit、service、controller等の局所契約と、担当する結合テストの過不足を確認します。
    e2e: ブラウザーの利用導線、API、HTTP・module境界をまたぐ検証の過不足を確認します。
  checks:
  - テストの変更がゼロでも、変更した責務と要件から必要な検証を確かめます。
  - controllerの直接呼び出しとHTTP経由の検証など、実際に通る境界で担当を分けます。
  - qaとe2eは、正常系（happy path）と異常系（fail path）それぞれの不足・過剰を確認し、義務・根拠・状態を累積台帳に残します。
  - 正常な成功・状態変更と、対象責務で適用される入力拒否・権限拒否・依存先失敗等を確かめます。例の網羅を目的に範囲を広げません。
  - 正常系の成功で異常系の未確認を代用しません。片面に適用義務がなければ、実reviewerが対象なしの根拠を台帳に残します。
  - 期待する動作、入力・失敗条件、assertion、fixture、mock、実行結果を必要な範囲で照合します。
  - 不足は未検証の契約と影響を示します。過剰は不要な理由と削除後も残る検証を示します。
  - 過剰の例は、意味のない重複、実装細部への過剰依存、変更範囲外、効果のないケースです。
  - 件数、行数、coverage率だけを減らすために削除しません。別の責務と正常系・異常系の両面で必要な検証を保ちます。
  - 不足・過剰の全指摘を台帳に残します。上位3件などの表示目安で残りを捨てません。
  - 対象なしは実agentが変更内容から根拠付きで判断します。ファイルなしだけで承認しません。
  - 実装側の自己点検、既存の同名QA出力、未実行のテストを実行証拠に置き換えません。
  ownership:
  - Claude QA/E2Eはテストの不足・過剰とCodex実行証拠の妥当性だけをレビューします。テスト実行・再実行、Playwright/CI操作、source/test/fixtureの作成・修正・削除はCodexのみが行います。
  - 各担当は自分の指摘を確認し、他層の未解決と区別します。必要な根拠が欠ければ承認しません。
  verdicts:
    APPROVE: 担当する全範囲の正常系・異常系の過不足確認を完了し、不足・過剰の指摘、質問、必要な証拠待ちがゼロです。適用なしは根拠を台帳に残します。
    REQUEST_CHANGES: 根拠のある不足・過剰の指摘が残っています。🟢も対象です。
    DEFER: 必要な証拠、委譲、別モデルの確認、環境の確認が不足しています。
  clean_output: 指摘がなければ短いAPPROVEと必須のWorkflow Resultで足ります。問題を作りません。
review_gates:
  order:
  - qa
  - e2e
  - l1_5
  - l2
  independence: |
    実装側はCodex、外部レビュー側はClaude Codeです。
    qaとe2eは実装者と別モデルの実agentへ委譲します。実装側の同名QAで代用しません。
    実装担当と外部reviewerのプラットフォーム、モデル設定と実呼び出しを記録します。
    上記model_policyに従います。同じ実装モデルへの置換や架空のtraceは不可です。
    別モデルでの実呼び出しを確認できなければ、承認を保留します。
  approval: 各層の全対象と必要な証拠を確認し、自層の🟢を含む指摘・質問がゼロの場合のみ承認します。
  handoffs: 別担当のhandoffは担当・根拠を保持し、自層の未確認を付け替えて承認しません。最終引渡しでは全handoffも解消します。
  snapshot_change: source/テスト/要件/規則の変更で旧四承認は失効します。一括修正後、既存担当がqa→e2e→cr→advの順で修正差分と未変更証拠の現版での有効性を確認し、同じ最終source snapshotへ自分の承認を更新します。Codexが旧承認を付け替えません。まだ開始していない層を先行起動せず、通常の順序で独立確認します。各層は、snapshot変更後も承認の更新を必ず行います。影響しない義務の判定は各層の担当が行い、修正が呼び出し元・共有helper・テスト対象のコードに直接または呼び出し経路を通じて届く義務は再確認します。再利用は、前回の証拠が現版でも有効と自層が確認した場合に限り、「証拠再利用：<ID>, <前回Checked/Executedしたsnapshot_id>, <影響しないと判断した根拠(変更したパス・シンボルと当該義務の対応)>」と1行で記録します。テスト変更はqaとe2eの全義務、要件・仕様・規則の変更はその出典を根拠にする全層の全義務を再確認し、判定した層と根拠を記録します。
  coverage: COMPLETEは累積した当該phaseの全対象・必須確認の完了です。今回sliceだけや未確認の証拠を含めて承認せず、PARTIALは元の同じ担当が続けます。
  native_approval:
    l1_5: L1.5_APPROVEを受理します。L1.5_APPROVE_WITH_NOTESはCR自身が根拠付きでqa/e2e/l2へ分類したhandoffだけの場合です。局所の🟢や未確認を付け替えません。
    qa_e2e: native APPROVE、全対象COMPLETE、happy/fail両面の不足・過剰確認と必要証拠が完了していることが必要です。適用なしは実担当が根拠を残します。
    l2: native APPROVE、全対象COMPLETE、必要な独立相談・検証証拠と自層の全指摘・質問の解消が必要です。最終引渡しでは全層の未解決handoffもゼロです。
  new_prior_finding: snapshotが同じでも、新しい根拠で前段の指摘が再開したら、その担当と依存する後段の承認をpendingへ戻し、同じ担当で必要範囲を再確認します。
findings:
  scope: 🟢を含め、依頼範囲で提示された改善・修正指摘をすべて対応対象にします。
  rules:
  - 各指摘にIDと担当を付け、修正前後と再確認結果を対応させます。
  - Codexの修正完了はfix_candidateです。担当レビュアーが確認するまで閉じません。
  - fix_candidateごとに、ID、修正前後の要点、変更ファイルを上村さんへ返します。
  - 無関係な新規🟢の上限は、review_cycle.rereview_capに従います。
  - 軽微、任意、DEFER、Follow-upという分類だけでは先送りしません。
  - 誤検知は根拠を示し、担当レビュアーが撤回した記録を残します。
  - Codex単独で却下、取り下げ、対応不要、解消済みにしません。
  - 良い点の紹介や状態表示の🟢は、修正指摘として数えません。
  - 範囲外の変更や根拠のない好みを自動実装せず、判断に迷えば上村さんへ質問します。
  - 表示件数や読取予算を理由に指摘を捨てません。未確認部分は同層で続行します。
  closed_statuses:
  - reviewer_confirmed_fixed
  - reviewer_withdrawn
questions:
  recipient: 上村さんです。
  rules:
  - 実装、仕様、修正方針の疑問点はすべて記録し、上村さんへ質問します。
  - Claudeは質問を応答へ返します。Codexが上村さんへ伝え、回答を同じ担当へ返します。
  - AI同士の合意を本人の回答として扱わず、推測で仕様を決めません。
  - 関連する疑問をまとめ、判断対象、根拠、選択肢を簡潔に示します。
  - 回答に依存する編集と承認を止め、NEEDS_USER_INPUTで待ちます。
  - 取得可能な事実や資料の確認は続けます。回答を受けたら停止地点から再開します。
  - 回答で要件や対象が変わった場合はsnapshotと必要な承認を更新します。
response_contract:
  block_name: Workflow Result
  note: CLI標準のJSON項目ではありません。回答本文へ付ける補助のYAMLブロックです。
  fields:
    workflow_id: codex-claude-review
    phase: l1_5、qa、e2e、l2のいずれかです。
    reviewer: 実際に呼び出したagent名です。
    snapshot_id: 今回確認した値です。未確認ならnullにします。
    native_verdict: 既存判定を記載します。qa/e2eはAPPROVE、REQUEST_CHANGES、DEFERです。
    coverage: 当該phaseの全対象に対するCOMPLETE、PARTIAL、BLOCKEDです。今回sliceだけで判定しません。
    decision: APPROVE、REQUEST_CHANGES、NEEDS_USER_INPUT、BLOCKED、CONTINUE_REVIEWのいずれかです。
    open_item_ids: 未解決指摘のID一覧です。局所指摘と別担当のhandoffを区別します。
    questions: 上村さんへの未回答質問です。
    handoffs: 担当、質問、根拠、状態を含む引き継ぎ一覧です。
    invocation_evidence: 外部review役割、プラットフォーム、実装者とreviewerのモデル設定、親session_id、実子agent_id、初回Agentまたは再開SendMessageの実行証拠、専門相談の識別子、phase、snapshotです。
  acceptance: decisionがAPPROVEで、phaseの承認条件を満たす場合だけ受理します。項目欠落、本文との矛盾、snapshot不一致は未承認です。invocation_evidenceにmode=single-layerを含む結果は、引渡し可・最終承認として受理しません。Codexが単層モードで起動した依頼の結果で、invocation_evidenceに送信したphaseと一致するmode=single-layer phase=<phase>が欠けている、または別のphaseの場合は、decisionがAPPROVEでも未承認として扱い、四層承認にもしません。同じ担当に不足の補完を求めます。
  compact_output: 判定と変わった結論を先に短く返します。全指摘・未確認・証拠台帳と必須11項目は保ち、同じ指摘・全diff・未変更規則・長いlogの繰り返しを避けます。短さは承認条件を緩めません。
handoff:
  terminal_state: awaiting_kamimura_review
  review_report_owner: adviserが統合した短い結果を返します。専門家の詳細回答を重複掲載しません。
  conditions:
  - 最終source snapshotへの四層承認と、全指摘・質問・handoff・必須相談・必要な検証の完了です。単層モードでは、その層の完了のみで、四層の引渡し可を意味しません(single_layer参照)。
  - 変更は未コミットです。許可された初回基準のindexは固定し、修正は未stage、新規はuntrackedとし、対象外と既存stageを保全します。承認は現在working sourceに対応し、最終stage/commitは人間が行います。
  audit_records: 実際の相談・結果・重要な未解決は保持します。明示された全会話/HTML保存は完全な別成果物とし、短い最終本文と区別します。承認後、CodexはLLMを使わない決定的なスクリプトtools/render_review_record.pyでHTMLを作ります。対象projectにtoolsはないため、.codex/AGENTS.mdのリンク先を解決したリポジトリの同ファイルを使います(未検証)。秘密の伏せ処理は完全でなく、共有前に利用者が確認します。保存先は、project固有の定めがあればそれに従い、なければ対象project直下の.codex/review-records/です(setupがgit管理から除外する.codex配下。提案の既定で、上村さんの確認待ちです)。
  commit_owner: 上村さん本人です。
staged_baseline:
  authorization: この初回stage方式は、利用者が承認済みのHQ既定ルールです。対象のreview/修正サイクルでは毎回の再承認を求めず、HQが正確な初回対象だけをstageします。別の明示指示を優先し、既存indexを安全に保全できなければ保留します。一律stage禁止への対象内の例外であり、今回の設定修正をstageしない指示、上位権限、逆方向、commit/push禁止は変更しません。
  preflight: HEAD、対象path/hunk/base、除外、既存indexのcontent/mode、working/untracked状態を確認します。対象外・環境・機密を含めず、元のstaged hunkと無関係なindex
    entryを保存できるか判断します。
  partial_index: 既存staged版とworking版が違う同じpathへ丸ごとgit addしません。全必要内容と旧stageを保全できなければ、正確な問題を報告して保留します。元indexを不変に保つ別review indexは、許可内でHQ、初回と再開したClaude親子の全Git処理に同じGIT_INDEX_FILEが一貫して適用できる実証がある場合だけ代替にできます。確認できなければ保留します。
  initial: 初回対象だけを一度stageし、実際のindex identityとpath/contentを基準として保持します。追加・削除・rename両端と初回untracked内容を落とさず、無条件のgit add .や全体add/reset/stashは行いません。
  first_review: 実際のbaseに対するgit diff --cachedと元コードを確認します。後続層の初回は固定基準に加え現在の修正も確認し、層ごとにstageし直しません。
  fix: 修正は未stageに保ち、indexを更新しません。通常git diffで初回基準以後の追跡済み変更を確認し、git statusと未追跡の新規内容も別途確認します。削除・rename先も失いません。
  integrity: 修正から戻った際に固定index identityと照合します。基準の変更・欠落は保留し、自動で復元・再stage・上書きしません。同じ担当が実際の修正前後と全指摘を確認します。
  handoff: 承認対象は現在working sourceです。indexは初回基準、修正と新規は未stage/untrackedのままと伝えます。最終stageとcommitは人間が確認して行います。
