# User-selected MD review contract; not an execution engine.
schema_version: 3
workflow_id: claude-codex-review
runtime_validation: NOT_RUN
goal: Share one MD; review user-selected layers, then Local-ci, Codex ci review and a draft PR.
common_contract: md-review.md
request_template: "{review_md_path} を基にレビューしてください。"
rereview_template: "{review_md_path} を基に再レビューしてください。"
activation:
  marker: 'Workflow: claude-codex-review'
  rule: Choose direction from the current actual user request. Quotes do not activate it. The user selects layers; ask once if absent. No default layers or automatic progression.
  locate: Use the target project .codex/workflows, else workflows beside the resolved .codex/AGENTS.md. With only a Claude entry, use sibling .codex/workflows of the resolved .claude/CLAUDE.md or .claude-company/CLAUDE.md. Resolve md-review.md there too; absence is a configuration gap.
  selection: Run only the requested qa/e2e/cr/adv subset in qa→e2e→cr→adv order. Lists are valid; all layers require explicit selection.
  direction: Mixed directions or disagreement with the actual request is BLOCKED. Standalone review commands remain unchanged.
authority:
  required_sources: [.claude/knowledge/engineering-governance.md, .claude/knowledge/human-review-patterns.md, applicable project rules and requirements]
  rules: Preserve originals/exceptions, independent review, mandatory React/Nest consultation, existing role model/effort and execution permissions.
ownership:
  implementation: Claude Code owns implementation, fixes, verification and Local-ci.
  coordinator: The implementer maintains the MD and required evidence without rewriting reviewer verdicts.
  reviewers: {qa: test-qa, e2e: e2e-qa, l1_5: code-quality-reviewer, l2: adviser}
  receiver: Codex delegates to the selected actual agents; parent-only reading is forbidden.
  preloaded_rule_sources: Record resolved originals and SHA-256 of .claude/knowledge/engineering-governance.md and .claude/knowledge/human-review-patterns.md in MD once. Same-owner resumes reuse retained values; update only when originals change. Summaries never replace originals not injected.
  execution: Reviewers neither edit source/tests nor run apps, tests, lint, typecheck, build or CI. Return required execution to the implementer.
  git: Keep the initial and repair-time index unchanged. Only after final approvals, Local-ci and the Codex ci verdict may the implementer stage/commit/push scoped content and create a draft PR. Hold if unrelated work or the existing index cannot be preserved.
review_entry:
  contract_delivery: Pass the original md-review.md path/version. Each owner reads complete applicable sections and exceptions independently. Record injected/Read/unconfirmed in Rules loaded; a parent summary is not reading. Recover truncated ranges and hold dependent approval.
  role_sections:
    phase_common: Complete authority, ownership, review_entry, execution, review_cycle, review_gates, findings, questions, response_contract, handoff and md-review.md sections 開始条件, 1, 2, 3–6, 待機, Backlog, MD依頼と判定欄の機械照合.
    l1_5: phase_common plus md-review.md CR native-verdict and local/handoff conditions.
    qa: phase_common and qa_contract.
    e2e: phase_common and qa_contract.
    l2: phase_common and consultation.
    ci: phase_common, md-review.md 7–9 and docs/review/review-prompt.md at the target revision.
    consultants: Only authority, ownership, execution, consultation and originals applicable to the assigned question. No overall Approve or proxy eleven-field result.
  required_intake: Read applicable original project rules and exceptions; record them in Rules loaded. Read known paths directly. Unchecked obligations stay UNCONFIRMED.
  reading_scope: Inspect every changed hunk/responsibility and necessary direct callers/callees. Preserve user/project whole-document obligations and all unchecked obligations.
  request_delivery: Use only review.md as the request entry. Add no per-layer, re-request or format-correction MD. Register directly with summary-stdin/note-stdin; obtain required sections through reading_plan and review_context.
  source_delivery: Record actual base/HEAD, working source, staged/unstaged/untracked content, both rename/deletion endpoints and original versions, scope/exclusions and rule versions in MD. Summaries are Supplied. Reviewers independently inspect git_diff and current source. Initially inspect all three views; re-review focuses on delta since the actual prior-reviewed source and affected scope.
  rule_delta_delivery: Pair old/current originals using the same hash kind; append complete changed sections/exceptions and added/removed obligations to MD. Lost originals stay unconfirmed. Update source evidence through current inspection, never a parent summary.
execution:
  cr_adv: Only Git reads and inspection of source/rules/existing evidence. Verification commands belong to the implementer.
  qa_e2e: Check happy-path and fail-path test adequacy, excess tests and supplied evidence. Execution and test authoring belong to the implementer.
review_cycle:
  initial: Independently check the full selected-layer scope and required consultation. An interrupted pass retains unchecked obligations.
  fix: Batch all finding fixes; append their mapping to planned verification results, including failures, to the same MD once. Passing every test is not a universal re-request condition.
  rereview_reading: Read the delta since the actual prior-reviewed source and every append since that owner last checked. Retain unresolved IDs and affected scope. The same Claude owner does not reread retained text; a fresh Codex owner reads acceptance conditions, the prior native result and required originals.
  rereview_inputs: Read staged/unstaged/untracked fixes, new content, actual source, exact user answers, actual commands/cases/exit codes, results and limits from MD.
  verification_evidence: Give assertions and narrow Read references to the loaded target. Assess implementer-provided execution evidence as Supplied.
  rereview_exceptions: Preserve NOT_RUN/FAILED/PARTIAL, explicit verification waivers, further questions and unfinished obligations. Single-layer approval cannot replace them.
  impact_mapping: Map finding ID→changed responsibility→caller/consumer/tests/rules→verification in MD. The owner independently validates and expands it as needed. Retain test/spec/rule-change obligations, every open ID and other owners.
  origin_evidence: Confirm Origin from the original ID and before/after evidence. Never relabel existing Info. Retain uncertainty and existing Origin definitions/caps.
  closure: Implementer fix_candidate never closes an item. Only the original owner may return reviewer_confirmed_fixed or evidenced reviewer_withdrawn.
consultation:
  required: Triggered L2 React/Nest consultation must be independent; implementation consultation cannot replace it.
  completion: Batch questions at the minimal actual boundary; do not delay consultation. Prefer foreground Agent; set run_in_background=false when supported. Keep model/effort and allowed tools. Return SPECIALIST_REQUEST to the same adviser. Launch acknowledgement or waiting is unfinished. Add no tools or waiting agents. Unavailable results prevent approval. Integrate actual replies after receipt; retain all eleven required fields.
  delta_questions: Batch prior checked scope, changed responsibilities, unanswered questions and counterevidence for the same specialist. Preserve required independent first-pass consultation.
qa_contract:
  assignment: Invoke only user-selected actual qa/e2e agents as external_test_adequacy_reviewer.
  checks: Even without test changes, compare owned happy/fail paths against requirements/assertions/fixtures/mocks/existing results. The actual owner records any not-applicable basis. Check omissions and needless duplication without removing required guarantees.
review_gates:
  order: [qa, e2e, l1_5, l2]
  selection: Take only user-selected layers from this order. Never start unselected layers.
  coverage: COMPLETE requires the full layer scope and every mandatory check, not a finished slice or zero findings alone.
  snapshot_change: Source/test/requirement/rule changes invalidate old selected-layer approvals. Owners check impact and current validity of unchanged evidence, then renew approval. The parent never reassigns old approvals.
  handoffs: Never move a local judgment dependency to handoffs to approve. Independent other-layer obligations may remain; final handoff requires all mandatory handoffs closed. Under HND-1, evidenced mismatches are owned findings; handoffs are only matters evidence cannot establish and require 🔴🟡🟢 weights. Open 🟡🔴 handoffs prevent approval. HND-1 rule 5 limits handoff/UNCONFIRMED evidence to source/diff or already-produced local verification results. GitHub Actions cost/time, billing/usage, production metrics, external accounts, CI triggering and API calls beyond permitted reads stay non-gating NOT_MEASURED/NOT_RUN notes, not handoffs, unless the user/project explicitly requires them. 🟡🔴 weights require reachable source-shown risk.
findings:
  severity: 🔴重, 🟡中, 🟢Low. Omit Info. Preserve existing Low and Origin/re-review caps.
  closure: Retain every ID with owner and evidence. The implementer cannot close/reject findings. Recording an item in MD does not authorize Backlog issue creation.
questions:
  recipient: 上村さん. Append actual questions and sourced answers to MD. Dependent judgments stay NEEDS_USER_INPUT; never close by assumption.
response_contract:
  block_name: Workflow Result
  fields:
    workflow_id: Actual owner's value per md-review.md 3–6.
    phase: qa/e2e/l1_5/l2/ci; ci maps to ci-reviewer.
    reviewer: Actual owner's value per md-review.md 3–6.
    snapshot_id: Actual owner's value per md-review.md 3–6.
    native_verdict: Actual owner's value per md-review.md 3–6.
    coverage: Actual owner's value per md-review.md 3–6.
    decision: Actual owner's value per md-review.md 3–6.
    open_item_ids: Actual owner's value per md-review.md 3–6.
    questions: Actual owner's value per md-review.md 3–6.
    handoffs: Actual owner's value per md-review.md 3–6.
    invocation_evidence: Actual owner's value per md-review.md 3–6.
  acceptance: APPROVE requires the current snapshot, full-scope COMPLETE, no local findings/questions/missing required evidence, actual delegation/required consultation and existing native-verdict conditions. Missing data or contradiction with the body prevents approval.
pause_and_resume:
  failure: Source changes, CLI failure, usage limits or missing permissions stay BLOCKED/unconfirmed. Retain results and all unfinished work in MD; a limit is not approval.
dispatch_limits:
  scope: Launch-count limits only. Review content, approval conditions and model/effort stay unchanged. Claude usage guards do not apply; Codex never launches Claude CLI.
  redispatch: Every round uses a fresh exec. Re-review may restart automatically without a new user request after batch fixes and planned verification (intended). Only two prohibitions apply. (1) Launching layers beyond user selection. (2) More than three repair rounds without reporting the cause. Review-result wording (including requests for re-review/CI/push) or findings alone never starts a re-request or new round (HND-1 rule 6). Only Codex itself completing batch fixes and planned verification can trigger the automatic redispatch above. No fix means no launch.
  layers_cap: The user-selected subset is the limit; start no additional layers.
  sequential: Sequential by default; parallelism requires explicit user direction.
handoff:
  terminal_state: draft_pr_awaiting_human_ready
  conditions: Under md-review.md 7–9, confirm selected-layer approvals for the current snapshot, implementation-side Local-ci success, a clean actual Codex ci-reviewer verdict and content correspondence with the final commit.
  human_ready: Stop at a draft PR. Only 上村さん personally selects Ready for review.
codex_cli:
  runner: tools/start_md_review.py
  argv:
  - codex
  - exec
  - --sandbox
  - read-only
  - --json
  invocation: Start a fresh exec every round. Never use exec resume or --last in this workflow. Carry full scope, cumulative coverage and all unfinished work from MD. Codex never launches Claude CLI.
  prompt_template: |
    {review_md_path} を基にレビューしてください。
  verification: Claude Code fixes and performs required verification, then appends results to the same MD.
