# 利用者指定のMDレビュー契約です。実行エンジンではありません。
schema_version: 3
workflow_id: claude-codex-review
runtime_validation: NOT_RUN
goal: MDを共有し、利用者が選んだ層を確認後、Local-ci、Codex ciレビュー、draft PRへ進みます。
common_contract: md-review.md
request_template: "{review_md_path} を基にレビューしてください。"
rereview_template: "{review_md_path} を基に再レビューしてください。"
activation:
  marker: 'Workflow: claude-codex-review'
  rule: 現在の利用者の実依頼で向きを確認します。引用は起動しません。層は利用者が指定し、未指定なら1つ質問します。既定層も自動昇格もありません。
  locate: 対象projectの.codex/workflows、なければ解決済み.codex/AGENTS.mdの隣のworkflowsを使います。Claude入口しかない場合は解決済み.claude/CLAUDE.mdまたは.claude-company/CLAUDE.mdの兄弟.codex/workflowsを使います。md-review.mdも同じ場所で解決します。見つからなければ設定不足です。
  selection: qa/e2e/cr/advの指定した部分集合だけをqa→e2e→cr→advの順で実行します。列挙は有効です。全層は明示指定時だけです。
  direction: 両方向の混在や実依頼との不一致はBLOCKEDです。通常の単独reviewコマンドは変更しません。
authority:
  required_sources: [.claude/knowledge/engineering-governance.md, .claude/knowledge/human-review-patterns.md, projectの適用規則と要件]
  rules: 原本と例外、独立レビュー、必須React/Nest相談、既存roleのmodel/effort、実行権限を維持します。
ownership:
  implementation: Claude Codeが実装、修正、検証、Local-ciを担当します。
  coordinator: 実装担当がMDと必要な証拠を保ち、reviewerの判定を書き換えません。
  reviewers: {qa: test-qa, e2e: e2e-qa, l1_5: code-quality-reviewer, l2: adviser}
  receiver: Codexは指定した実agentへ委譲します。主セッションだけの代読は不可です。
  preloaded_rule_sources: .claude/knowledge/engineering-governance.mdと.claude/knowledge/human-review-patterns.mdの解決済み原本とSHA-256をMDへ一度記録します。同一ownerの再開は保持値を使い、原文変更時だけ更新します。未注入の原文を要約で代用しません。
  execution: reviewerはsource/testを編集せず、アプリ、テスト、lint、型確認、build、CIを実行しません。必要な実行は実装担当へ返します。
  git: 開始時と修正中のindexを変更しません。最終承認とLocal-ciとCodex ci判定後だけ、実装担当が対象を限定してstage/commit/pushしdraft PRを作ります。対象外と既存indexを保全できなければ保留します。
review_entry:
  contract_delivery: md-review.mdの原本のpath/版を渡し、各担当が自分で完全な適用節と例外を確認します。Rules loadedへ注入済み/Read/未確認を記録します。親の要約だけでは既読にしません。切詰めは不足を回収し、依存する承認を保留します。
  role_sections:
    phase_common: authority、ownership、review_entry、execution、review_cycle、review_gates、findings、questions、response_contract、handoffとmd-review.mdの開始条件、1、2、3–6、待機、Backlog、MD依頼と判定欄の機械照合の完全な節です。
    l1_5: phase_commonです。md-review.mdのCRのnative判定、局所とhandoffの条件も適用します。
    qa: phase_commonとqa_contractです。
    e2e: phase_commonとqa_contractです。
    l2: phase_commonとconsultationです。
    ci: phase_common、md-review.mdの7–9と対象revisionのdocs/review/review-prompt.mdです。
    consultants: authority、ownership、execution、consultationと担当質問の適用原文だけです。全体Approveや11項目の代理作成はしません。
  required_intake: 原本/例外込みの適用project規則を確認し、Rules loadedへ残します。既知pathはReadで直接確認します。未確認はUNCONFIRMEDです。
  reading_scope: 全変更hunk、変更責務、必要な直接caller/calleeを確認します。利用者やproject規則の全文確認義務を維持し、未確認の義務を残します。
  source_delivery: MDへ実base/HEAD、working source、staged/unstaged/untracked、rename/削除両端と元版、対象/除外、規則の版を記録します。サマリーはSuppliedです。reviewerが独立にgit_diffと現ソースを確認します。初回は全3view、再レビューは前回の実確認版からのdeltaと影響先を中心にします。
  rule_delta_delivery: 旧原文と現原文を同じ種類のhashで対応させ、変更した完全な節と例外、追加/削除した義務をMDへ追記します。旧原文が失われた場合は未確認です。親の要約で置換せず、今回の現物確認で出典を更新します。
execution:
  cr_adv: Git読取とsource/規則/既存証拠の確認だけです。検証コマンドは実装担当です。
  qa_e2e: 正常系（happy path）と異常系（fail path）のテスト過不足と提示証拠を確認します。実行やテスト作成は実装担当です。
review_cycle:
  initial: 指定した層の全対象と必須相談を独立確認します。途中終了は未確認を保持します。
  fix: 全指摘を一括修正し、失敗を含む予定済み検証結果と修正の対応を同じMDへ一度に追記します。全テスト成功を一律の再依頼条件にはしません。
  rereview_inputs: staged/unstaged/untrackedの修正、新規内容、実source、正確な利用者回答、実コマンド/ケース/終了コード、結果と限界をMDから参照します。
  verification_evidence: assertionと読み込んだ対象の狭いRead参照を示します。実装担当の提示証拠をSuppliedとして確認します。
  rereview_exceptions: NOT_RUN/FAILED/PARTIAL、明示的な検証免除、追加質問、未了義務は維持します。単層承認で代替しません。
  impact_mapping: 指摘ID→変更責務→caller/consumer/テスト/規則→検証をMDで対応させ、担当が独立に確かめ必要なら広げます。テスト/仕様/規則変更の義務、全open ID、他ownerを落としません。
  origin_evidence: 元IDと新旧の証拠でOriginを確認します。既存Infoの付替えは禁止です。不明は保持します。既存Origin定義・上限は変更しません。
  closure: 実装担当のfix_candidateでは閉じません。元担当のreviewer_confirmed_fixedまたは根拠付きreviewer_withdrawnだけです。
consultation:
  required: L2のReact/Nest条件が該当すれば独立相談が必須です。実装時の相談で代用しません。
  completion: 最小限の実境界で質問をまとめ、依頼を遅らせません。可能なら前景Agent、run_in_background対応時はfalseです。model/effortや許可toolは変更しません。SPECIALIST_REQUESTは同じadviserへ返します。起動確認や回答待ちは未完了です。tool追加や待機agentで埋めません。取得不能は未承認です。実回答の受領後に統合し、必要な11項目を保持します。
  delta_questions: 前回確認範囲、変更責務、未回答と反証を同じ専門担当へまとめます。必須の独立初回相談は省略しません。
qa_contract:
  assignment: qa/e2eのうち利用者が選択した実agentだけをexternal_test_adequacy_reviewerとして呼びます。
  checks: テスト変更ゼロでも、担当する責務の正常系・異常系、要件/assertion/fixture/mock/既存結果を照合します。適用なしは実担当が根拠を残します。欠落も不要な重複も確認し、必要な保証を消しません。
review_gates:
  order: [qa, e2e, l1_5, l2]
  selection: この順から利用者の選択層だけを取り出します。未選択層を起動しません。
  coverage: COMPLETEは当該層の全対象と必須確認の完了です。slice終了や指摘ゼロだけでは不可です。
  snapshot_change: source/テスト/要件/規則の変更で古い選択層の承認を失効させます。影響確認と未変更証拠の現版での有効性を担当が確認し、新承認を返します。親は付け替えません。
  handoffs: 自層判断に必要な未確認をhandoffへ移して承認しません。独立した他層の義務は残せます。最終引渡しには全必須handoffの解消が必要です。
findings:
  severity: 🔴重、🟡中、🟢Lowです。Infoは記載しません。既存Low上限とOrigin/再レビュー上限を維持します。
  closure: 全IDを担当と根拠付きで保持します。実装担当の判断で解消/却下しません。MD内の起票をBacklog課題作成の許可にしません。
questions:
  recipient: 上村さんです。実際の質問と出典付き回答をMDへ追記します。依存する判断はNEEDS_USER_INPUTです。推測で閉じません。
response_contract:
  block_name: Workflow Result
  fields:
    workflow_id: md-review.mdの3–6で定義した実担当の値です。
    phase: qa/e2e/l1_5/l2/ciです。ciはci-reviewerに対応します。
    reviewer: md-review.mdの3–6で定義した実担当の値です。
    snapshot_id: md-review.mdの3–6で定義した実担当の値です。
    native_verdict: md-review.mdの3–6で定義した実担当の値です。
    coverage: md-review.mdの3–6で定義した実担当の値です。
    decision: md-review.mdの3–6で定義した実担当の値です。
    open_item_ids: md-review.mdの3–6で定義した実担当の値です。
    questions: md-review.mdの3–6で定義した実担当の値です。
    handoffs: md-review.mdの3–6で定義した実担当の値です。
    invocation_evidence: md-review.mdの3–6で定義した実担当の値です。
  acceptance: 現snapshot、全対象COMPLETE、自層の指摘/質問/必要証拠ゼロ、実委譲と必要相談、既存native判定条件を満たすときだけAPPROVEです。欠落や本文との矛盾は未承認です。
pause_and_resume:
  failure: source変更、CLI失敗、利用上限、権限不足はBLOCKED/未確認です。結果と全未了をMDへ保持します。上限到達を承認へ読み替えません。
handoff:
  terminal_state: draft_pr_awaiting_human_ready
  conditions: md-review.mdの7–9に従い、選択層の現snapshot承認、実装側Local-ci成功、実Codex ci-reviewerの指摘なし判定、最終commitとの内容対応を確認します。
  human_ready: draft PRまでです。Ready for reviewは上村さん本人だけが行います。
codex_cli:
  runner: tools/start_md_review.py
  argv:
  - codex
  - exec
  - --sandbox
  - read-only
  - --json
  invocation: 毎roundで新しいexecを起動します。この手順ではexec resumeや--lastを使いません。全対象、累積coverage、全未了をMDから引き継ぎます。CodexはClaude CLIを起動しません。
  prompt_template: |
    {review_md_path} を基にレビューしてください。
  verification: Claude Codeが修正と必要な検証を行い、同じMDへ結果を追記します。
